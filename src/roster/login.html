<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Roster · Bellicose Church</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#17191b">
<meta name="apple-mobile-web-app-title" content="Roster">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#17191b radial-gradient(120% 70% at 50% 0%,#24304d 0%,#17191b 60%);color:#fff;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.box{width:100%;max-width:340px;text-align:center}
.logo{width:64px;height:64px;border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.4);margin-bottom:18px}
h1{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
p{color:rgba(255,255,255,.6);font-size:14px;margin:0 0 24px}
input{width:100%;font-size:28px;text-align:center;letter-spacing:12px;padding:14px 14px 14px 26px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.06);color:#fff;font-family:inherit}
input{-webkit-text-security:disc}input::placeholder{color:rgba(255,255,255,.3)}
input:focus{outline:none;border-color:#7aa2ff;box-shadow:0 0 0 3px rgba(122,162,255,.25)}
button{margin-top:12px;width:100%;padding:15px;font-size:16px;font-weight:650;color:#17191b;background:#fff;border:0;border-radius:14px;cursor:pointer;font-family:inherit}
button:active{background:#e4e7ec}
.err{color:#ff8a80;font-size:14px;margin-top:14px;min-height:20px}
.foot{margin-top:28px;font-size:12px;color:rgba(255,255,255,.35)}
</style></head><body>
<form class="box" method="post" action="/roster/login">
<img class="logo" src="/favicon.svg" alt="" width="64" height="64">
<h1>Team Roster</h1>
<p>Enter the access PIN to continue.</p>
<input name="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" autofocus placeholder="••••" aria-label="PIN">
<button type="submit">View roster</button>
<div class="err">__ERROR__</div>
<div class="foot">Bellicose Church</div>
</form></body></html>
